name: cashund
description: Private, offline expense tracker with an on-device AI buddy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  auto_route: ^11.2.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.22

dev_dependencies:
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/buddy/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
