name: Release

# Pushing a version tag (e.g. v0.1.0) builds a signed release APK and
# publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      # A tag never releases code that wouldn't pass CI.
      - name: Check formatting, analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      # The keystore and its passwords live in repository secrets. Without
      # them this fails on purpose, so a debug-signed APK is never released.
      - name: Set up the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release key secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # The tag sets the version name (v0.1.0 → 0.1.0); the run number
      # always grows, as Android needs for updates.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "cashund-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: cashund-${{ github.ref_name }}.apk
          generate_release_notes: true
